name: Deploy v5 Preview

on:
  push:
    branches:
      - v4

env:
  THEME_NAME: its-theme

permissions:
  contents: read
  deployments: write
  id-token: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    name: v5 Build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - env:
          PASSWORD: ${{ secrets.QUARTZ_PASSWORD }}
        run: find ./content -type f -print0 | xargs -0 sed -i "s/HIDE_FROM_PLAYERS/${PASSWORD}/g"

      - run: bun i

      - name: Fetch Quartz Theme
        run: curl -s -S https://raw.githubusercontent.com/saberzero1/quartz-themes/master/action.sh | bash -s -- $THEME_NAME

      - name: Install Quartz plugins
        run: bun run -b quartz/bootstrap-cli.mjs plugin install

      - name: Check types and style
        run: bun run check

      - name: Build Quartz
        run: bun run -b quartz/bootstrap-cli.mjs build -v

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
